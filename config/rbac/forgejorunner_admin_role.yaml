# This rule is not used by the project forgejo-runner-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over ci.cleoverse.net.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: forgejo-runner-operator
    app.kubernetes.io/managed-by: kustomize
  name: forgejorunner-admin-role
rules:
- apiGroups:
  - ci.cleoverse.net
  resources:
  - forgejorunners
  verbs:
  - '*'
- apiGroups:
  - ci.cleoverse.net
  resources:
  - forgejorunners/status
  verbs:
  - get
