# This rule is not used by the project forgejo-runner-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ci.cleoverse.net.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: forgejo-runner-operator
    app.kubernetes.io/managed-by: kustomize
  name: forgejorunner-editor-role
rules:
- apiGroups:
  - ci.cleoverse.net
  resources:
  - forgejorunners
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ci.cleoverse.net
  resources:
  - forgejorunners/status
  verbs:
  - get
